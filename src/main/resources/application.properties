spring.application.name=security_ms
server.port=8181
spring.datasource.url=jdbc:mysql://localhost:3306/security_ms_db_martes
spring.datasource.username=root
spring.datasource.password=root123456789

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

security.jwt.secret=${JWT_SECRET:clave-local-educativa-de-32-bytes}
security.jwt.cookie-name=${JWT_COOKIE_NAME:AUTH_TOKEN}
security.jwt.cookie-secure=${COOKIE_SECURE:true}

# Firebase Admin SDK para validar los ID tokens de Google, Microsoft y GitHub.
# FIREBASE_ENABLED=true habilita el endpoint POST /api/auth/oauth.
# FIREBASE_PROJECT_ID debe ser el ID del proyecto de Firebase (se valida el audience del token).
# Las credenciales se toman de GOOGLE_APPLICATION_CREDENTIALS (Application Default Credentials)
# o de FIREBASE_CREDENTIALS_PATH, que debe apuntar a un archivo fuera del repositorio.
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
firebase.check-revoked=${FIREBASE_CHECK_REVOKED:true}

profile-images.storage-path=${PROFILE_IMAGES_PATH:uploads/profile-images}
profile-images.public-url=${PROFILE_IMAGES_PUBLIC_URL:/api/profile-images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
