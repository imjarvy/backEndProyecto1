# Firebase Admin SDK para validar los ID tokens de Google, Microsoft y GitHub.
# FIREBASE_ENABLED=true habilita el endpoint POST /api/auth/oauth.
# FIREBASE_PROJECT_ID debe ser el ID del proyecto de Firebase (se valida el audience del token).
# Las credenciales se toman de GOOGLE_APPLICATION_CREDENTIALS (Application Default Credentials)
# o de FIREBASE_CREDENTIALS_PATH, que debe apuntar a un archivo fuera del repositorio.
firebase.enabled=${FIREBASE_ENABLED:true}
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
firebase.check-revoked=${FIREBASE_CHECK_REVOKED:true}

profile-images.storage-path=${PROFILE_IMAGES_PATH:uploads/profile-images}
profile-images.public-url=${PROFILE_IMAGES_PUBLIC_URL:/api/profile-images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
